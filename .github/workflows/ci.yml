name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go build & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build -o bin/celld ./cmd/celld
          go build -o bin/cell ./cmd/cell
          CGO_ENABLED=0 go build -o bin/cell-egress ./cmd/cell-egress
          CGO_ENABLED=0 go build -o bin/cell-guest-agent ./cmd/cell-guest-agent

      - name: Unit tests (worker packages)
        run: |
          go test ./internal/worker/cache/ ./internal/worker/auth/ ./internal/worker/envtemplate/ \
            ./internal/worker/egress/ ./internal/worker/manager/ ./internal/worker/httpserver/ \
            ./internal/worker/source/git/ ./internal/worker/runtime/ ./internal/worker/runtime/docker/ \
            ./internal/worker/runtime/microvm/ ./internal/worker/runtime/microvm/guestproto/ \
            ./internal/worker/remote/ ./internal/worker/peers/ \
            ./internal/control/registry/ ./internal/control/metrics/ ./internal/version/

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v2.9.0+ is built with Go 1.26; older pins refuse go.mod go 1.26.
          version: v2.9.0
          args: --timeout=5m

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  smoke:
    name: API smoke
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: API smoke (host fallback, temp cell-home)
        env:
          CELL_RUNTIME: host
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh

  cluster:
    name: Compose cluster smoke
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v7

      - name: Build and start compose cluster
        run: docker compose up --build -d

      - name: Cluster smoke
        env:
          CELL_WORKER_TOKEN: cell-dev-token
        run: |
          chmod +x scripts/cluster-smoke.sh
          ./scripts/cluster-smoke.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose down -v

  python:
    name: Python SDK syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile SDK
        run: python -m compileall -q sdk/python/src