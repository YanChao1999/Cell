name: go-1.23
description: Go 1.23 on Debian Bookworm with module/build caches

image: golang:1.23-bookworm

cache_mounts:
  - host: go-mod
    container: /go/pkg/mod
  - host: go-build
    # Under workspace-friendly path (Cell runs non-root; avoid /root).
    container: /workspace/.cache/go-build

setup_timeout: 5m
setup:
  - go version
  # Example conditional (no-op here): only run when go.mod exists
  # - run: go mod download
  #   if: test -f go.mod

env:
  GO111MODULE: "on"
  CGO_ENABLED: "0"
  GOMODCACHE: /go/pkg/mod
  GOCACHE: /workspace/.cache/go-build

default_limits:
  cpu: "2"
  memory: 4Gi
  disk: 10Gi

default_exec_timeout: 30m

# Egress: default | none | allowlist (+ egress.allow; cell-egress sidecar).
network: default
