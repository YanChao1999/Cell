name: go-1.23
description: Go 1.23 on Debian Bookworm with module/build caches

image: golang:1.23-bookworm

cache_mounts:
  - host: go-mod
    container: /go/pkg/mod
  - host: go-build
    # Under workspace-friendly path (Cell runs non-root; avoid /root).
    container: /workspace/.cache/go-build

setup:
  - go version

env:
  GO111MODULE: "on"
  CGO_ENABLED: "0"
  GOMODCACHE: /go/pkg/mod
  GOCACHE: /workspace/.cache/go-build

default_limits:
  cpu: "2"
  memory: 4Gi
  disk: 10Gi

default_exec_timeout: 30m

# Egress policy: default = normal Docker outbound (agents need modules/docs).
# none = air gap. allowlist = future proxy allowlist (refused until implemented).
network: default
