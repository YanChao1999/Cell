[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-sdk"
version = "0.1.0"
description = "Python SDK for Spark — ephemeral isolated environments for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Spark Contributors" }]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
