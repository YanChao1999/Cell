[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cell-mcp"
version = "0.1.0"
description = "MCP server for Cell — expose Sandbox tools to Cursor and other agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0,<3",
]

[project.scripts]
cell-mcp = "cell_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cell_mcp"]
